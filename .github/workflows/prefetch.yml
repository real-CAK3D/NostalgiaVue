name: Nightly YouTube pre-fetch

# Fills data/yt/ with YouTube search results so viewers don't spend the API quota.
# Needs the repository secret YT_API_KEY (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: '37 8 * * *'   # 08:37 UTC, overnight in the US
  workflow_dispatch:
    inputs:
      budget:
        description: 'Searches to run (100 quota units each)'
        default: '70'

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run searches
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_BUDGET: ${{ github.event.inputs.budget || '70' }}
        run: node scripts/prefetch-yt.mjs
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yt
          git diff --cached --quiet || { git commit -m "Nightly YouTube pre-fetch" && git push; }
